{{ define "main" }}
<!-- CONTENT -->
<div id="content" class="pure-u-1 pure-u-md-3-4 pure-u-sm-1">
    <div class="pad">
        {{- partial "render_single_article.html" (dict "page" . "isList" false) -}}

        {{- if and site.Config.Services.Disqus.Shortname (not (.Params.disableComments | default false)) }}
        {{ partial "disqus.html" . }}
        {{- end }}
    </div>
</div>
{{ end }}
